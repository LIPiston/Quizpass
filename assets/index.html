<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>白名单申请 - Quizpass</title>
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --bg-panel: #16213e;
            --bg-input: #0f0f1a;
            --border-dark: #2a2a4a;
            --border-light: #3d3d6b;
            --text-primary: #e0e0e0;
            --text-secondary: #9a9ab0;
            --text-muted: #6a6a80;
            --error-red: #e74c3c;
            --error-glow: rgba(231, 76, 60, .3);
            --success-green: #2ecc71;
            --accent: #4caf50;
            --accent-hover: #45a049;
            --accent-active: #3d8b40;
            --accent-glow: rgba(76, 175, 80, .35);
            --accent-border: #2e7d32;
            --accent-soft-bg: rgba(76, 175, 80, .08);
            --accent-soft-border: rgba(76, 175, 80, .35);
            --accent-soft-text: #a5d6a7;
            --btn-bg: linear-gradient(145deg, #4caf50, #388e3c);
            --btn-bg-hover: linear-gradient(145deg, #58bb5c, #43a047);
            --btn-bg-active: linear-gradient(145deg, #3d8b40, #2e7d32);
            --btn-shadow: 0 4px 14px rgba(76, 175, 80, .3);
            --shadow-heavy: 0 18px 44px rgba(0, 0, 0, .55);
            --shadow-light: 0 2px 8px rgba(0, 0, 0, .35);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            background:
                radial-gradient(circle at 50% 0%, #23234a 0%, var(--bg-dark) 45%, #101020 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Faint horizontal scanlines, echoing the game's menu background. */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, .015) 0,
                    rgba(255, 255, 255, .015) 1px,
                    transparent 1px,
                    transparent 4px
                );
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 560px;
            padding: 40px 36px 36px;
            background: var(--bg-panel);
            border: 3px solid var(--border-dark);
            border-radius: 12px;
            box-shadow: var(--shadow-heavy);
            transition: border-color .4s ease, box-shadow .4s ease;
        }

        .container:focus-within {
            border-color: var(--border-light);
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .header::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            margin: 18px auto 0;
            border-radius: 2px;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .title {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .subtitle {
            margin: 10px 0 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .8px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .label .required {
            color: var(--accent);
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-input);
            border: 2px solid var(--border-dark);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 16px;
            caret-color: var(--accent);
            outline: none;
            transition: border-color .25s ease, background-color .25s ease, box-shadow .25s ease;
        }

        .input-field::placeholder {
            color: #55556e;
        }

        .input-field:hover {
            background: #14142a;
        }

        .input-field:focus {
            background: #12121f;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow), 0 0 20px var(--accent-glow);
        }

        .input-field.error {
            border-color: var(--error-red);
            box-shadow: 0 0 0 3px var(--error-glow);
        }

        /* --- 游戏方式: two exclusive cards --- */
        .auth-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .auth-option {
            position: relative;
        }

        /* Visually hidden but focusable, so the native radio keeps arrow-key behaviour. */
        .auth-option input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .auth-option label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 2px solid var(--border-dark);
            border-radius: 8px;
            cursor: pointer;
            transition: border-color .25s ease, background-color .25s ease, box-shadow .25s ease;
        }

        .auth-option label:hover {
            background: #14142a;
            border-color: var(--border-light);
        }

        .auth-option input:checked + label {
            background: var(--accent-soft-bg);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .auth-option input:focus-visible + label {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .auth-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .auth-desc {
            font-size: 12px;
            line-height: 1.4;
            color: var(--text-secondary);
        }

        .auth-options.error label {
            border-color: var(--error-red);
        }

        .auth-options.error input:checked + label {
            border-color: var(--error-red);
            box-shadow: 0 0 0 3px var(--error-glow);
        }

        .field-message {
            margin: 8px 0 0;
            font-size: 13px;
            line-height: 1.5;
            color: var(--error-red);
        }

        .field-message:empty {
            display: none;
        }

        .hint {
            margin: 8px 0 0;
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-muted);
        }

        .btn-submit {
            width: 100%;
            padding: 15px 20px;
            margin-top: 4px;
            background: var(--btn-bg);
            border: none;
            border-radius: 8px;
            box-shadow: var(--btn-shadow);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background .25s ease, transform .15s ease, box-shadow .25s ease;
        }

        .btn-submit:hover:not(:disabled) {
            background: var(--btn-bg-hover);
            transform: translateY(-1px);
        }

        .btn-submit:active:not(:disabled) {
            background: var(--btn-bg-active);
            transform: translateY(0);
            box-shadow: inset 0 3px 10px rgba(0, 0, 0, .3);
        }

        .btn-submit:disabled {
            background: #3a3a50;
            box-shadow: none;
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            display: none;
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }

        .status-message.visible {
            display: block;
        }

        .status-message.error {
            background: rgba(231, 76, 60, .1);
            border: 1px solid rgba(231, 76, 60, .4);
            color: #ff8a7a;
        }

        .status-message.success {
            background: var(--accent-soft-bg);
            border: 1px solid var(--accent-soft-border);
            color: var(--accent-soft-text);
        }

        /* --- success view --- */
        .success-view {
            text-align: center;
        }

        .success-view[hidden] {
            display: none;
        }

        .success-icon {
            width: 84px;
            height: 84px;
            margin: 0 auto 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-soft-bg);
            border: 3px solid var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 28px var(--accent-glow);
            font-size: 42px;
            font-weight: 700;
            color: var(--accent);
        }

        .success-title {
            margin: 0;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-soft-text);
        }

        .success-detail {
            margin: 16px 0 0;
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .success-detail strong {
            color: var(--text-primary);
        }

        .success-actions {
            margin-top: 30px;
        }

        .btn-secondary {
            padding: 12px 26px;
            background: transparent;
            border: 2px solid var(--border-light);
            border-radius: 8px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: border-color .25s ease, color .25s ease, background-color .25s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, .04);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .footer-note {
            margin: 26px 0 0;
            padding-top: 20px;
            border-top: 1px solid var(--border-dark);
            font-size: 12px;
            line-height: 1.7;
            color: var(--text-muted);
            text-align: center;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 22px 26px;
            }

            .title {
                font-size: 21px;
            }

            .auth-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="title">白名单申请</h1>
        <p class="subtitle">填写下列信息即可申请加入服务器白名单</p>
    </div>

    <div id="formView">
        <form id="signupForm" novalidate>
            <div class="form-group">
                <label class="label" for="playerName">游戏内名称 <span class="required">*</span></label>
                <input
                    class="input-field"
                    id="playerName"
                    name="username"
                    type="text"
                    placeholder="请输入游戏内名称"
                    autocomplete="off"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    maxlength="16"
                    required
                    aria-describedby="nameMessage">
                <p class="field-message" id="nameMessage" role="alert"></p>
            </div>

            <div class="form-group">
                <span class="label" id="accountLabel">游戏方式 <span class="required">*</span></span>
                <div class="auth-options" id="accountOptions" role="radiogroup" aria-labelledby="accountLabel">
                    <div class="auth-option">
                        <input type="radio" id="accountPremium" name="account" value="premium">
                        <label for="accountPremium">
                            <span class="auth-name">正版</span>
                            <span class="auth-desc">Mojang / 微软账号</span>
                        </label>
                    </div>
                    <div class="auth-option">
                        <input type="radio" id="accountSkin" name="account" value="skin">
                        <label for="accountSkin">
                            <span class="auth-name">皮肤站</span>
                            <span class="auth-desc">第三方皮肤站登录</span>
                        </label>
                    </div>
                </div>
                <p class="field-message" id="accountMessage" role="alert"></p>
            </div>

            <div class="form-group">
                <label class="label" for="playerQq">QQ 号 <span class="required">*</span></label>
                <input
                    class="input-field"
                    id="playerQq"
                    name="qq"
                    type="text"
                    inputmode="numeric"
                    placeholder="请输入 QQ 号，便于管理员联系你"
                    autocomplete="off"
                    maxlength="11"
                    required
                    aria-describedby="qqMessage">
                <p class="field-message" id="qqMessage" role="alert"></p>
            </div>

            <button class="btn-submit" id="submitBtn" type="submit">
                <span id="btnText">提交申请</span>
            </button>
        </form>

        <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>
    </div>

    <div class="success-view" id="successView" hidden>
        <div class="success-icon" aria-hidden="true">&#10003;</div>
        <h2 class="success-title" id="successTitle">恭喜，白名单已添加</h2>
        <p class="success-detail">
            玩家 <strong id="successPlayer"></strong> 已加入服务器白名单，现在可以进入服务器了。
        </p>
        <div class="success-actions">
            <button class="btn-secondary" id="againBtn" type="button">再申请一位</button>
        </div>
    </div>

    <p class="footer-note">提交后由服务器自动处理，通常数秒内生效。<br>如长时间未生效，请联系管理员。</p>
</div>

<script>
    (function () {
        'use strict';

        var ENDPOINT = '/api/add-whitelist';
        var NAME_PATTERN = /^[A-Za-z0-9_]{3,16}$/;
        var QQ_PATTERN = /^[1-9][0-9]{4,10}$/;

        var formView = document.getElementById('formView');
        var form = document.getElementById('signupForm');
        var nameInput = document.getElementById('playerName');
        var qqInput = document.getElementById('playerQq');
        var accountOptions = document.getElementById('accountOptions');
        var submitBtn = document.getElementById('submitBtn');
        var btnText = document.getElementById('btnText');
        var statusMessage = document.getElementById('statusMessage');
        var successView = document.getElementById('successView');
        var successPlayer = document.getElementById('successPlayer');
        var againBtn = document.getElementById('againBtn');

        var nameMessage = document.getElementById('nameMessage');
        var accountMessage = document.getElementById('accountMessage');
        var qqMessage = document.getElementById('qqMessage');

        var isSubmitting = false;
        var statusTimeout = null;

        function showStatus(message, type) {
            if (statusTimeout) {
                clearTimeout(statusTimeout);
                statusTimeout = null;
            }

            statusMessage.textContent = message;
            statusMessage.className = 'status-message visible ' + type;

            statusTimeout = setTimeout(function () {
                statusMessage.className = 'status-message';
                statusTimeout = null;
            }, 8000);
        }

        function hideStatus() {
            if (statusTimeout) {
                clearTimeout(statusTimeout);
                statusTimeout = null;
            }
            statusMessage.className = 'status-message';
        }

        function setLoading(loading) {
            isSubmitting = loading;
            submitBtn.disabled = loading;
            btnText.textContent = loading ? '提交中…' : '提交申请';
        }

        function clearErrors() {
            nameInput.classList.remove('error');
            accountOptions.classList.remove('error');
            qqInput.classList.remove('error');
            nameMessage.textContent = '';
            accountMessage.textContent = '';
            qqMessage.textContent = '';
        }

        function setFieldError(field, message) {
            if (field === 'name') {
                nameInput.classList.add('error');
                nameMessage.textContent = message;
            } else if (field === 'account') {
                accountOptions.classList.add('error');
                accountMessage.textContent = message;
            } else if (field === 'qq') {
                qqInput.classList.add('error');
                qqMessage.textContent = message;
            }
        }

        function selectedAccount() {
            var checked = form.querySelector('input[name="account"]:checked');
            return checked ? checked.value : '';
        }

        /** Mirrors the server-side validation so most problems never reach the network. */
        function validate() {
            clearErrors();

            var name = nameInput.value.trim();
            var account = selectedAccount();
            var qq = qqInput.value.trim();
            var ok = true;
            var focusTarget = null;

            if (!name) {
                setFieldError('name', '请输入游戏内名称。');
                ok = false;
                focusTarget = focusTarget || nameInput;
            } else if (!NAME_PATTERN.test(name)) {
                setFieldError('name', '名称需为 3-16 位字母、数字或下划线。');
                ok = false;
                focusTarget = focusTarget || nameInput;
            }

            if (!account) {
                setFieldError('account', '请选择游戏方式。');
                ok = false;
                focusTarget = focusTarget || form.querySelector('input[name="account"]');
            }

            if (!qq) {
                setFieldError('qq', '请输入 QQ 号。');
                ok = false;
                focusTarget = focusTarget || qqInput;
            } else if (!QQ_PATTERN.test(qq)) {
                setFieldError('qq', 'QQ 号需为 5-11 位数字。');
                ok = false;
                focusTarget = focusTarget || qqInput;
            }

            if (focusTarget && focusTarget.focus) {
                focusTarget.focus();
            }

            return ok;
        }

        function showSuccess(player) {
            successPlayer.textContent = player;
            formView.hidden = true;
            successView.hidden = false;
            hideStatus();
            window.scrollTo(0, 0);
            againBtn.focus();
        }

        function resetForm() {
            successView.hidden = true;
            formView.hidden = false;
            form.reset();
            clearErrors();
            hideStatus();
            setLoading(false);
            nameInput.focus();
        }

        /** Reads the most specific explanation Kalmia returned for a failed request. */
        function errorMessage(response, fallback) {
            return response.json().then(function (data) {
                if (!data || typeof data !== 'object') {
                    return fallback;
                }
                return data.message || data.error_message || data.error || fallback;
            }).catch(function () {
                return fallback;
            });
        }

        function handleSubmit(event) {
            event.preventDefault();

            if (isSubmitting) {
                return;
            }

            hideStatus();

            if (!validate()) {
                var hasMessage = nameMessage.textContent || accountMessage.textContent || qqMessage.textContent;
                if (hasMessage) {
                    showStatus('请检查上方标红的字段后重新提交。', 'error');
                }
                return;
            }

            var payload = {
                username: nameInput.value.trim(),
                account: selectedAccount(),
                qq: qqInput.value.trim()
            };

            setLoading(true);

            fetch(ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(payload)
            }).then(function (response) {
                if (response.ok) {
                    showSuccess(payload.username);
                    return null;
                }

                var fallback;
                if (response.status === 400) {
                    fallback = '提交的信息有误，请检查后重试。';
                } else if (response.status === 503) {
                    fallback = '服务器暂时无法处理白名单请求，请稍后重试。';
                } else {
                    fallback = '提交失败，服务器返回状态码 ' + response.status + '。';
                }

                return errorMessage(response, fallback).then(function (message) {
                    showStatus(message, 'error');
                });
            }).catch(function () {
                showStatus('网络错误，无法连接到服务器。请检查网络后重试。', 'error');
            }).then(function () {
                setLoading(false);
            });
        }

        /** Typing again clears the previous complaint about that field. */
        function clearOnInput(input, field) {
            input.addEventListener('input', function () {
                input.classList.remove('error');
                if (field === 'name') {
                    nameMessage.textContent = '';
                } else {
                    qqMessage.textContent = '';
                }
                hideStatus();
            });
        }

        clearOnInput(nameInput, 'name');
        clearOnInput(qqInput, 'qq');

        accountOptions.addEventListener('change', function () {
            accountOptions.classList.remove('error');
            accountMessage.textContent = '';
            hideStatus();
        });

        nameInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                qqInput.focus();
            }
        });

        qqInput.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                qqInput.value = '';
                clearErrors();
                hideStatus();
            }
        });

        form.addEventListener('submit', handleSubmit);
        againBtn.addEventListener('click', resetForm);

        if (document.hasFocus && document.hasFocus()) {
            nameInput.focus();
        }
    })();
</script>
</body>
</html>
