<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 白名单管理</title>
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --bg-panel: #16213e;
            --bg-input: #0f0f1a;
            --border-dark: #2a2a4a;
            --border-light: #3d3d6b;
            --text-primary: #e0e0e0;
            --text-secondary: #9a9ab0;
            --error-red: #e74c3c;
            --success-green: #2ecc71;
            --shadow-heavy: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.3);
            --font-minecraft: 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-minecraft);
            background-color: var(--bg-dark);
            background-image:
                    radial-gradient(ellipse at 20% 50%, rgba(30, 30, 60, 0.6) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 50%, rgba(30, 30, 60, 0.6) 0%, transparent 60%),
                    radial-gradient(ellipse at 50% 20%, rgba(40, 40, 80, 0.4) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                    repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(255, 255, 255, 0.015) 4px, rgba(255, 255, 255, 0.015) 5px),
                    repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(255, 255, 255, 0.015) 4px, rgba(255, 255, 255, 0.015) 5px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: var(--bg-panel);
            border: 3px solid var(--border-dark);
            border-radius: 12px;
            padding: 40px 36px 36px;
            box-shadow: var(--shadow-heavy), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;

            /* ===== 主题变量（默认：添加模式 / 绿色） ===== */
            --accent: #4caf50;
            --accent-hover: #45a049;
            --accent-active: #3d8b40;
            --accent-glow: rgba(76, 175, 80, 0.35);
            --accent-border: #2e7d32;
            --accent-soft-bg: rgba(76, 175, 80, 0.1);
            --accent-soft-border: rgba(76, 175, 80, 0.35);
            --accent-soft-text: #7ddc9f;
            --btn-bg: linear-gradient(145deg, #4caf50, #388e3c);
            --btn-bg-hover: linear-gradient(145deg, #56c25a, #43a047);
            --btn-bg-active: linear-gradient(145deg, #388e3c, #2e7d32);
            --btn-shadow: rgba(76, 175, 80, 0.3);
            --btn-shadow-hover: rgba(76, 175, 80, 0.4);
            --btn-shadow-focus: rgba(76, 175, 80, 0.4);
            --tab-active-bg: rgba(76, 175, 80, 0.18);
            --tab-active-border: #4caf50;
            --tab-active-text: #7ddc9f;
        }

        /* ===== 移除模式 / 红色主题 ===== */
        .container.remove-mode {
            --accent: #e74c3c;
            --accent-hover: #c0392b;
            --accent-active: #a93226;
            --accent-glow: rgba(231, 76, 60, 0.35);
            --accent-border: #922b21;
            --accent-soft-bg: rgba(231, 76, 60, 0.1);
            --accent-soft-border: rgba(231, 76, 60, 0.4);
            --accent-soft-text: #e88d82;
            --btn-bg: linear-gradient(145deg, #e74c3c, #c0392b);
            --btn-bg-hover: linear-gradient(145deg, #ec7063, #d44637);
            --btn-bg-active: linear-gradient(145deg, #c0392b, #a93226);
            --btn-shadow: rgba(231, 76, 60, 0.3);
            --btn-shadow-hover: rgba(231, 76, 60, 0.4);
            --btn-shadow-focus: rgba(231, 76, 60, 0.4);
            --tab-active-bg: rgba(231, 76, 60, 0.18);
            --tab-active-border: #e74c3c;
            --tab-active-text: #e88d82;
        }

        .container:focus-within {
            border-color: var(--border-light);
            box-shadow: var(--shadow-heavy), 0 0 20px var(--accent-glow);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
            transition: all 0.4s ease;
        }

        .header::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 16px auto 0;
            border-radius: 2px;
            box-shadow: 0 0 12px var(--accent-glow);
            transition: all 0.4s ease;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            line-height: 1.3;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
            letter-spacing: 0.5px;
            font-weight: 400;
            transition: color 0.4s ease;
        }

        /* ===== 模式切换标签页 ===== */
        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 5px;
            border: 1px solid var(--border-dark);
            transition: border-color 0.4s ease;
        }

        .mode-tab {
            flex: 1;
            padding: 11px 14px;
            font-size: 14px;
            font-family: var(--font-minecraft);
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-secondary);
            background: transparent;
            border: 2px solid transparent;
            border-radius: 7px;
            cursor: pointer;
            outline: none;
            transition: all 0.35s ease;
            user-select: none;
            position: relative;
        }

        .mode-tab:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }

        .mode-tab:focus-visible {
            box-shadow: 0 0 0 3px var(--accent-glow);
            border-color: var(--accent);
        }

        .mode-tab.active {
            color: var(--tab-active-text);
            background: var(--tab-active-bg);
            border-color: var(--tab-active-border);
            box-shadow: 0 0 14px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .mode-tab .tab-icon {
            display: inline-block;
            margin-right: 6px;
            font-size: 15px;
            vertical-align: middle;
            transition: transform 0.3s ease;
        }

        .mode-tab.active .tab-icon {
            transform: scale(1.15);
        }

        /* ===== 表单 ===== */
        .form-group {
            margin-bottom: 24px;
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            user-select: none;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            font-family: var(--font-minecraft);
            font-weight: 500;
            color: var(--text-primary);
            background-color: var(--bg-input);
            border: 2px solid var(--border-dark);
            border-radius: 8px;
            outline: none;
            transition: all 0.35s ease;
            letter-spacing: 0.5px;
            caret-color: var(--accent);
        }

        .input-field::placeholder {
            color: #55556e;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .input-field:hover {
            border-color: var(--border-light);
            background-color: #14142a;
        }

        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow), 0 0 20px var(--accent-glow);
            background-color: #12121f;
        }

        .input-field.error {
            border-color: var(--error-red);
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.25);
        }

        .input-field.error:focus {
            border-color: var(--error-red);
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.25);
        }

        .btn-submit {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            font-family: var(--font-minecraft);
            font-weight: 700;
            color: #ffffff;
            background: var(--btn-bg);
            border: 2px solid var(--accent-border);
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            transition: all 0.35s ease;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            user-select: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--btn-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .btn-submit:hover {
            background: var(--btn-bg-hover);
            box-shadow: 0 6px 25px var(--btn-shadow-hover), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            background: var(--btn-bg-active);
            box-shadow: 0 2px 10px var(--btn-shadow), inset 0 2px 4px rgba(0, 0, 0, 0.3);
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: #3a3a50;
            border-color: #2a2a40;
            color: #6a6a80;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-submit:focus-visible {
            box-shadow: 0 0 0 3px var(--accent-glow), 0 6px 25px var(--btn-shadow-focus);
        }

        .btn-submit .btn-text {
            position: relative;
            z-index: 1;
        }

        .btn-submit .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        .btn-submit.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status-message {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.4px;
            display: none;
            transition: all 0.35s ease;
            line-height: 1.5;
            word-break: break-word;
        }

        .status-message.visible {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .status-message.success {
            background-color: var(--accent-soft-bg);
            border: 1px solid var(--accent-soft-border);
            color: var(--accent-soft-text);
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        .status-message.error {
            background-color: rgba(231, 76, 60, 0.12);
            border: 1px solid rgba(231, 76, 60, 0.4);
            color: #e88d82;
            box-shadow: 0 2px 12px rgba(231, 76, 60, 0.1);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #55556e;
            letter-spacing: 0.3px;
            user-select: none;
        }

        @media (max-width: 520px) {
            .container {
                padding: 28px 20px 24px;
                border-radius: 10px;
            }
            .title {
                font-size: 21px;
            }
            .input-field {
                padding: 12px 15px;
                font-size: 15px;
            }
            .btn-submit {
                padding: 13px 16px;
                font-size: 15px;
            }
            .mode-tab {
                padding: 9px 10px;
                font-size: 12px;
                letter-spacing: 0.3px;
            }
            .mode-tab .tab-icon {
                margin-right: 3px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="header">
        <h1 class="title">白名单管理</h1>
        <p class="subtitle" id="subtitleText">添加玩家至 Minecraft 服务器白名单</p>
    </div>

    <!-- 模式切换标签页 -->
    <div class="mode-tabs" role="tablist" aria-label="白名单操作模式">
        <button
                type="button"
                class="mode-tab active"
                id="tabAdd"
                role="tab"
                aria-selected="true"
                aria-controls="whitelistForm"
                data-mode="add"
        >
            <span class="tab-icon">➕</span>添加
        </button>
        <button
                type="button"
                class="mode-tab"
                id="tabRemove"
                role="tab"
                aria-selected="false"
                aria-controls="whitelistForm"
                data-mode="remove"
        >
            <span class="tab-icon">➖</span>移除
        </button>
    </div>

    <form id="whitelistForm" novalidate autocomplete="off">
        <div class="form-group">
            <label class="label" for="playerName" id="inputLabel">玩家名称</label>
            <div class="input-wrapper">
                <input
                        type="text"
                        id="playerName"
                        class="input-field"
                        placeholder="请输入 Minecraft 玩家名称"
                        required
                        maxlength="16"
                        minlength="1"
                        autofocus
                />
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text" id="btnText">确认添加</span>
            <span class="spinner"></span>
        </button>

        <div class="status-message" id="statusMessage"></div>
    </form>

    <p class="footer-note">Quizpass</p>
</div>

<script>
    (function () {
        const container = document.getElementById('mainContainer');
        const form = document.getElementById('whitelistForm');
        const input = document.getElementById('playerName');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');
        const tabAdd = document.getElementById('tabAdd');
        const tabRemove = document.getElementById('tabRemove');
        const subtitleText = document.getElementById('subtitleText');
        const inputLabel = document.getElementById('inputLabel');
        const btnText = document.getElementById('btnText');

        const API_ENDPOINTS = {
            add: '/api/add-whitelist',
            remove: '/api/remove-whitelist'
        };

        const UI_TEXT = {
            add: {
                subtitle: '添加玩家至 Minecraft 服务器白名单',
                btnText: '确认添加',
                inputLabel: '玩家名称',
                placeholder: '请输入 Minecraft 玩家名称',
                successDefault: function (name) {
                    return '玩家 "' + name + '" 已成功添加至白名单。';
                },
                errorDefault: function (status) {
                    return '添加失败，服务器返回状态码 ' + status + '。';
                },
                networkError: '网络错误，无法连接到服务器。请检查网络后重试。'
            },
            remove: {
                subtitle: '从 Minecraft 服务器白名单移除玩家',
                btnText: '确认移除',
                inputLabel: '玩家名称',
                placeholder: '请输入要移除的玩家名称',
                successDefault: function (name) {
                    return '玩家 "' + name + '" 已成功从白名单移除。';
                },
                errorDefault: function (status) {
                    return '移除失败，服务器返回状态码 ' + status + '。';
                },
                networkError: '网络错误，无法连接到服务器。请检查网络后重试。'
            }
        };

        let currentMode = 'add';
        let isSubmitting = false;
        let statusTimeout = null;

        function showStatus(message, type) {
            if (statusTimeout) {
                clearTimeout(statusTimeout);
                statusTimeout = null;
            }

            statusMessage.textContent = message;
            statusMessage.className = 'status-message visible ' + type;

            statusTimeout = setTimeout(function () {
                statusMessage.className = 'status-message';
                statusTimeout = null;
            }, 5000);
        }

        function hideStatus() {
            if (statusTimeout) {
                clearTimeout(statusTimeout);
                statusTimeout = null;
            }
            statusMessage.className = 'status-message';
        }

        function setLoading(loading) {
            isSubmitting = loading;
            submitBtn.disabled = loading;
            if (loading) {
                submitBtn.classList.add('loading');
            } else {
                submitBtn.classList.remove('loading');
            }
        }

        function clearInputError() {
            input.classList.remove('error');
        }

        function setInputError() {
            input.classList.add('error');
            input.focus();
            input.addEventListener('input', function onInput() {
                clearInputError();
                input.removeEventListener('input', onInput);
            }, { once: true });
        }

        function isValidPlayerName(name) {
            const trimmed = name.trim();
            if (trimmed.length < 3 || trimmed.length > 16) {
                return false;
            }
            const regex = /^[A-Za-z0-9_]+$/;
            return regex.test(trimmed);
        }

        function switchMode(mode) {
            if (mode === currentMode) {
                return;
            }
            if (isSubmitting) {
                return;
            }

            currentMode = mode;

            container.classList.toggle('remove-mode', mode === 'remove');

            tabAdd.classList.toggle('active', mode === 'add');
            tabRemove.classList.toggle('active', mode === 'remove');
            tabAdd.setAttribute('aria-selected', mode === 'add');
            tabRemove.setAttribute('aria-selected', mode === 'remove');

            const text = UI_TEXT[mode];
            subtitleText.textContent = text.subtitle;
            btnText.textContent = text.btnText;
            inputLabel.textContent = text.inputLabel;
            input.placeholder = text.placeholder;

            input.value = '';
            clearInputError();
            hideStatus();

            input.focus();
        }

        async function postToServer(playerName) {
            const endpoint = API_ENDPOINTS[currentMode];
            return await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ username: playerName })
            });
        }

        async function handleSubmit(event) {
            event.preventDefault();

            if (isSubmitting) {
                return;
            }

            hideStatus();
            clearInputError();

            const rawName = input.value;
            const playerName = rawName.trim();
            const text = UI_TEXT[currentMode];

            if (!playerName) {
                showStatus('请输入玩家名称。', 'error');
                setInputError();
                return;
            }

            if (!isValidPlayerName(playerName)) {
                showStatus('玩家名称格式无效，请使用 3-16 个字母、数字或下划线。', 'error');
                setInputError();
                return;
            }

            setLoading(true);

            try {
                const response = await postToServer(playerName);

                if (response.ok) {
                    let responseData = null;
                    try {
                        responseData = await response.json();
                    } catch (e) {

                    }
                    const successMsg = (responseData && responseData.message) ||
                        text.successDefault(playerName);
                    showStatus(successMsg, 'success');
                    input.value = '';
                    input.focus();
                } else {
                    let errorMsg = text.errorDefault(response.status);
                    try {
                        const errorData = await response.json();
                        if (errorData && errorData.message) {
                            errorMsg = errorData.message;
                        } else if (errorData && errorData.error_message) {
                            // Kalmia reports the abort reason here; `error` only carries a generic
                            // protocol string, so prefer the specific message.
                            errorMsg = errorData.error_message;
                        } else if (errorData && errorData.error) {
                            errorMsg = errorData.error;
                        }
                    } catch (e) {

                    }
                    showStatus(errorMsg, 'error');
                }
            } catch (networkError) {
                showStatus(text.networkError, 'error');
            } finally {
                setLoading(false);
            }
        }

        function handleInputKeydown(event) {
            if (event.key === 'Escape') {
                input.value = '';
                clearInputError();
                hideStatus();
                input.focus();
            }
        }

        tabAdd.addEventListener('click', function () {
            switchMode('add');
        });

        tabRemove.addEventListener('click', function () {
            switchMode('remove');
        });

        tabAdd.addEventListener('keydown', function (event) {
            if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
                event.preventDefault();
                switchMode('remove');
                tabRemove.focus();
            }
        });

        tabRemove.addEventListener('keydown', function (event) {
            if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
                event.preventDefault();
                switchMode('add');
                tabAdd.focus();
            }
        });

        form.addEventListener('submit', handleSubmit);

        input.addEventListener('keydown', handleInputKeydown);

        input.addEventListener('input', function () {
            clearInputError();
            if (statusMessage.classList.contains('visible')) {
                hideStatus();
            }
        });

        window.addEventListener('load', function () {
            input.focus();
        });

        if (document.hasFocus && document.hasFocus()) {
            input.focus();
        }
    })();
</script>
</body>
</html>
